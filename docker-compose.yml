version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: railmate_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: railmate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: railmate_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/railmate
      SECRET_KEY: railmate-super-secret-jwt-key-2026-production-ready
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python app/seed/seed_data.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: railmate_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
